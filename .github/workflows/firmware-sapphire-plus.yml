name: Sapphire Plus Firmware Build

on:
  push:
    branches:
      - lts-2.1.2
      - bugfix-2.1.x
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    name: Build mks_robin_nano_v1v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-firmware-v1

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'Marlin/config.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: platformio run -e mks_robin_nano_v1v2

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp .pio/build/mks_robin_nano_v1v2/Robin_nano35.bin dist/
          cp .pio/build/mks_robin_nano_v1v2/firmware.bin dist/ || true
          cp .pio/build/mks_robin_nano_v1v2/firmware.elf dist/ || true
          if [ -d ".pio/build/mks_robin_nano_v1v2/assets" ]; then
            tar -czf dist/assets-mks_robin_nano_v1v2.tar.gz -C .pio/build/mks_robin_nano_v1v2 assets
          fi
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-mks_robin_nano_v1v2
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    name: Publish release assets
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware-mks_robin_nano_v1v2
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
